name: Build data

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (00:17, 03:17, … UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-data.mjs

      - name: Render index.html from data
        run: node scripts/build-html.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data.json index.html; then
            echo "Nothing changed."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json index.html
            git commit -m "chore: refresh data.json and rebuild page"
            git push
          fi
